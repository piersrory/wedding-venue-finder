[project]
name = "wedding-venue-finder"
version = "0.1.0"
description = "Finds and ranks Spanish wedding venues against our requirements, with a quote for every fact"
readme = "README.md"
authors = [
    { name = "Piers", email = "266090285+piersrory@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
write-extraction = "wedding_venue_finder.extraction:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
